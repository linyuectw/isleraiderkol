<title>浮島奇兵 KOL 合作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout concept: a deep-sea hero with a floating island, then a calm chart-paper page.
   One bold moment (island + cannon shot toward the 50% coin); everything else stays quiet. */
:root {
  --bg: #F1F6F5;
  --surface: #FFFFFF;
  --ink: #0C2B3A;
  --muted: #4A6572;
  --line: #CBDCDC;
  --sea: #0E6A87;
  --sea-soft: #DDEEF0;
  --signal: #FF6B47;
  --signal-ink: #2A0F06;
  --warn: #B3361B;
  --ok: #16744F;
  --hero-a: #123B98;
  --hero-b: #1673DC;
  --hero-ink: #F2F8FF;
  --hero-muted: #D3E6FA;
  --brass: #F2B84B;
  --font-body: "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Bricolage Grotesque", var(--font-body);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071A25;
    --surface: #0C2938;
    --ink: #E4F2F0;
    --muted: #9BB8C0;
    --line: #1A4155;
    --sea: #6CCBE0;
    --sea-soft: #0F3447;
    --signal: #FF7A59;
    --warn: #FF8F73;
    --ok: #6FD6A6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071A25;
  --surface: #0C2938;
  --ink: #E4F2F0;
  --muted: #9BB8C0;
  --line: #1A4155;
  --sea: #6CCBE0;
  --sea-soft: #0F3447;
  --signal: #FF7A59;
  --warn: #FF8F73;
  --ok: #6FD6A6;
  color-scheme: dark;
}
:root[data-lang="ja"] { --font-body: "Noto Sans JP", "Noto Sans TC", "Noto Sans KR", system-ui, sans-serif; }
:root[data-lang="ko"] { --font-body: "Noto Sans KR", "Noto Sans TC", "Noto Sans JP", system-ui, sans-serif; }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p, ol, ul { margin: 0; }
a { color: inherit; }
.wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- hero ---------- */
.hero {
  background: linear-gradient(170deg, var(--hero-b) 0%, #1B55C4 55%, var(--hero-a) 100%);
  color: var(--hero-ink);
  position: relative;
  overflow: hidden;
}
.hero::before, .band::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: url("assets/hero-pattern.webp") center top / cover no-repeat; opacity: .2;
}
.hero > .wrap { position: relative; z-index: 1; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; padding-block: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 40px; height: 40px; border-radius: 10px; display: block; }
.brand b { font-weight: 900; font-size: 18px; letter-spacing: .02em; }
.brand span { font-family: var(--font-display); font-size: 13px; color: var(--hero-muted); letter-spacing: .08em; text-transform: uppercase; }
.lang { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.1); }
.lang button {
  font: inherit; font-size: 13px; font-weight: 700; line-height: 1;
  min-height: 34px; padding: 0 12px; border: 0; border-radius: 999px;
  background: transparent; color: var(--hero-ink); cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--hero-ink); color: var(--hero-a); }
.lang button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .link:focus-visible {
  outline: 3px solid var(--brass); outline-offset: 2px;
}
.hero-grid { display: grid; gap: 28px; padding-block: 20px 72px; }
.eyebrow {
  font-family: var(--font-display); font-size: 17px; font-weight: 800;
  letter-spacing: .08em; text-transform: uppercase; color: var(--sea);
}
.hero .eyebrow { color: var(--brass); }
h1 {
  font-size: clamp(30px, 8vw, 54px); line-height: 1.18; font-weight: 900;
  text-wrap: balance; margin-top: 10px;
}
.lead { margin-top: 16px; color: var(--hero-muted); max-width: 34em; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 50px; padding: 0 24px; border-radius: 12px;
  font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; border: 0;
}
.btn-primary { background: var(--signal); color: var(--signal-ink); }
.btn-ghost { border: 1.5px solid var(--hero-muted); color: var(--hero-ink); background: transparent; }
.btn-line { border: 1.5px solid var(--line); background: transparent; color: var(--ink); }
.logo { display: block; width: min(300px, 78%); aspect-ratio: 7 / 5; object-fit: contain; object-position: left center; margin-bottom: 10px; filter: drop-shadow(0 8px 18px rgba(5, 22, 70, .35)); }
.art { width: 100%; max-width: 360px; margin: 0 auto; border-radius: 22px; overflow: hidden; line-height: 0; border: 3px solid rgba(255, 255, 255, .6); box-shadow: 0 18px 40px rgba(5, 22, 70, .45); }
.art img { display: block; width: 100%; height: auto; }
.island { animation: bob 5s ease-in-out infinite; transform-origin: 180px 160px; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.stat { display: flex; align-items: center; gap: 14px; justify-content: center; }
.stat { margin-top: 18px; }
.stat strong { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: 1; color: var(--brass); text-shadow: 0 4px 14px rgba(5, 22, 70, .4); }
.stat span { max-width: 13em; font-size: 14px; color: var(--hero-muted); line-height: 1.5; }
.wave { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 44px; display: block; }
.wave path { fill: var(--bg); }

/* ---------- sections ---------- */
.section { padding-block: 56px; }
.section + .section { padding-top: 8px; }
h2 { font-size: clamp(24px, 5.6vw, 36px); line-height: 1.3; font-weight: 900; margin-top: 8px; text-wrap: balance; }
.sec-lead { color: var(--muted); margin-top: 12px; max-width: 38em; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.fact.wide { grid-column: 1 / -1; }
.fact small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.fact .v { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.15; margin-top: 4px; }
.fact .v.text { font-family: var(--font-body); font-size: 18px; font-weight: 700; line-height: 1.5; }
.split { display: flex; margin-top: 20px; border-radius: 12px; overflow: hidden; font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.split > div { padding: 14px 16px; min-width: 0; }
.split .you { flex: 1 1 50%; background: var(--signal); color: var(--signal-ink); }
.split .rest { flex: 1 1 50%; background: var(--sea-soft); color: var(--sea); text-align: right; }
.split-cap { margin-top: 10px; color: var(--muted); font-size: 14px; }

.steps { list-style: none; padding: 0; margin-top: 32px; display: grid; gap: 0; counter-reset: s; }
.steps li { position: relative; padding: 0 0 28px 56px; min-width: 0; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: 0; width: 38px; height: 38px; border-radius: 50%;
  background: var(--sea); color: var(--surface);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800;
}
.steps li:not(:last-child)::after {
  content: ""; position: absolute; left: 18px; top: 44px; bottom: 6px; width: 2px; background: var(--line);
}
.steps h3, .feat h3 { font-size: 18px; font-weight: 700; line-height: 1.4; }
.steps p, .feat p { color: var(--muted); margin-top: 4px; }

.elig { display: grid; gap: 24px; margin-top: 28px; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 14vw, 88px); line-height: 1; color: var(--sea); }
.big-cap { font-size: clamp(22px, 5vw, 28px); font-weight: 900; line-height: 1.3; margin-top: 8px; }
.big-note { color: var(--muted); margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.elig h3 { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }

.feats { display: grid; gap: 22px; margin-top: 28px; }
.feat { border-top: 3px solid var(--sea); padding-top: 14px; min-width: 0; }
.tags { margin-top: 24px; font-weight: 700; color: var(--sea); }
.link { display: inline-block; margin-top: 12px; font-weight: 700; color: var(--sea); text-underline-offset: 4px; }

/* ---------- game band ---------- */
.section.band { position: relative; margin-top: 32px; margin-bottom: 24px; padding-block: 64px 0; color: var(--hero-ink); background: linear-gradient(175deg, #1B55C4 0%, var(--hero-a) 100%); overflow: hidden; }
.band .wrap { position: relative; z-index: 1; }
.band .eyebrow { color: var(--brass); }
.band .sec-lead, .band .feat p { color: var(--hero-muted); }
.band .feat { border-top-color: var(--brass); }
.band .tags { color: var(--brass); }
.band .tags { text-align: center; }
.game-btn { display: flex; width: fit-content; margin-inline: auto; margin-top: 20px; box-shadow: 0 6px 0 rgba(5, 22, 70, .35); }
.shots { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 28px 0 8px; padding: 4px 2px 18px; -webkit-overflow-scrolling: touch; }
.shots figure { flex: 0 0 62%; max-width: 240px; scroll-snap-align: center; margin: 0; min-width: 0; }
.phone { border-radius: 22px; padding: 6px; background: #0A1B45; border: 2px solid rgba(255, 255, 255, .45); box-shadow: 0 14px 30px rgba(5, 22, 70, .5); }
.phone img { display: block; width: 100%; height: auto; border-radius: 16px; aspect-ratio: 9 / 16; object-fit: cover; object-position: top; }
.shots figcaption { margin-top: 12px; display: grid; gap: 2px; font-size: 14px; line-height: 1.5; color: var(--hero-muted); }
.shots figcaption b { color: var(--brass); font-size: 16px; }
.shots figure:nth-child(even) { margin-top: 18px; }
@media (min-width: 800px) { .shots { overflow: visible; justify-content: center; gap: 22px; } .shots figure { flex: 1 1 0; max-width: 220px; } }
.crew { display: flex; justify-content: center; align-items: flex-end; gap: 0; max-width: 700px; margin: 36px auto 0; }
.crew img { width: 25%; max-width: 175px; height: auto; display: block; }

/* ---------- form ---------- */
.form-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; margin-top: 24px; }
.field { display: grid; gap: 6px; margin-bottom: 18px; min-width: 0; }
label { font-weight: 700; font-size: 15px; }
input, select, textarea {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input, select { min-height: 48px; }
textarea { min-height: 112px; resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--warn); }
.err { color: var(--warn); font-size: 14px; font-weight: 500; }
.hint { color: var(--muted); font-size: 14px; }
.status { font-size: 14px; font-weight: 700; min-height: 1.5em; }
.status.ok { color: var(--ok); }
.status.low { color: var(--warn); }
.form-card .btn { width: 100%; }
.plats { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
.plats legend { padding: 0; font-weight: 700; font-size: 15px; }
.plats .hint { margin: 4px 0 12px; }
.plat-list { display: grid; gap: 12px; }
.plat-head, .plat { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 8px; }
.plat-head { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.plat-name { grid-column: 1 / -1; font-size: 14px; font-weight: 700; }
.plats .err { margin-top: 10px; }
.total { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; font-weight: 700; }
.total strong { font-family: var(--font-display); font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.ways-list { display: grid; gap: 8px; margin-top: 8px; }
.way { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); font-weight: 500; cursor: pointer; min-width: 0; }
.way input { flex: none; width: 20px; height: 20px; min-height: 0; padding: 0; margin: 0; accent-color: var(--sea); }
.way:has(input:checked) { border-color: var(--sea); background: var(--sea-soft); }
.way-other { margin-top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* ---------- earnings simulator ---------- */
.sim { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; margin-top: 24px; }
.sim-row label { padding: 0; font-weight: 700; font-size: 15px; }
.sim-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sim-row output { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.sim input[type="range"] { min-height: 40px; padding: 0; border: 0; background: transparent; accent-color: var(--sea); margin-top: 4px; }
.sim-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sim-out { display: grid; gap: 22px; margin-top: 22px; }
.sim-result { padding: 18px; border-radius: 14px; background: var(--hero-a); color: var(--hero-ink); min-width: 0; }
.sim-cap { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--hero-muted); }
.sim-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 13vw, 68px); line-height: 1.05; color: var(--brass); margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sim-break { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.sim-break p { min-width: 0; }
.sim-break span { display: block; font-size: 13px; color: var(--hero-muted); }
.sim-break strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.sim-cmp { min-width: 0; }
.sim-sub { font-weight: 700; font-size: 15px; }
.bars { display: grid; gap: 4px; margin-top: 8px; }
.bar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; align-items: center; gap: 10px; width: 100%; padding: 8px 0; background: none; border: 0; font: inherit; font-size: 14px; color: var(--ink); text-align: left; cursor: pointer; }
.bar:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; border-radius: 8px; }
.bar-name { font-weight: 700; min-width: 0; line-height: 1.3; }
.bar-track { height: 14px; border-radius: 999px; background: var(--sea-soft); overflow: hidden; }
.bar-fill { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--sea); transition: width .35s ease; }
.bar.on .bar-fill { background: var(--signal); }
.bar-val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.sim-note { color: var(--muted); font-size: 13px; margin-top: 18px; }
.form-eyebrow { margin-top: 56px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
#res-sent { padding: 28px 0; }
.result h3 { font-size: 22px; font-weight: 900; }
.result p { color: var(--muted); margin-top: 8px; }
.summary {
  margin: 16px 0 0; padding: 14px; border-radius: 10px; background: var(--sea-soft); color: var(--ink);
  font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
}
.contact-line { margin-top: 14px; font-weight: 700; overflow-wrap: anywhere; user-select: text; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.actions .btn { width: auto; flex: 1 1 160px; }

footer { position: relative; overflow: hidden; margin-top: 56px; padding-block: 48px 190px; background: linear-gradient(180deg, #1B55C4 0%, var(--hero-a) 100%); color: var(--hero-muted); font-size: 14px; text-align: center; }
footer .wrap { position: relative; z-index: 1; }
footer::before, footer::after { content: ""; position: absolute; bottom: 0; width: 55%; height: 170px; background-repeat: no-repeat; background-size: auto 100%; pointer-events: none; }
footer::before { left: 0; background-image: url("assets/foot-left.webp"); background-position: left bottom; }
footer::after { right: 0; background-image: url("assets/foot-right.webp"); background-position: right bottom; }

@media (min-width: 860px) {
  .hero-grid { grid-template-columns: 1.1fr .9fr; align-items: center; gap: 40px; padding-block: 28px 96px; }
  .stat { justify-content: flex-start; }
  .facts { grid-template-columns: repeat(3, 1fr); }
  .fact.wide { grid-column: auto; }
  .fact .v.text { font-size: 16px; }
  .steps { grid-template-columns: repeat(5, 1fr); gap: 20px; }
  .steps li { padding: 52px 0 0; }
  .steps li:not(:last-child)::after { left: 48px; right: -14px; top: 18px; bottom: auto; width: auto; height: 2px; }
  .elig { grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
  .feats { grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .form-card { padding: 32px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
  .form-grid .full { grid-column: 1 / -1; }
  .ways-list { grid-template-columns: repeat(3, 1fr); }
  .sim { padding: 32px; }
  .sim-out { grid-template-columns: 1fr 1.2fr; gap: 32px; align-items: center; }
  .plat-head, .plat { grid-template-columns: 110px minmax(0, 1fr) minmax(0, .6fr); }
  .plat-head span:first-child { grid-column: 2; }
  .plat-name { grid-column: auto; align-self: center; }
  .form-card .btn { width: auto; min-width: 220px; }
}
@media (prefers-reduced-motion: reduce) { .island { animation: none; } .bar-fill { transition: none; } }
</style>

        <button type="button" data-lang="zh-TW">繁中</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>

      </div>
    </div>
    <div class="hero-grid">
      <div>
        <img class="logo" id="hero-logo" src="assets/logo-zh-TW.webp" alt="">
        <p class="eyebrow" data-i18n="heroEyebrow"></p>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#apply" id="cta-apply" data-i18n="ctaApply"></a>
          <a class="btn btn-ghost" href="https://g123.jp/game/island" target="_blank" rel="noopener" data-game-link data-i18n="ctaGame"></a>

</header>

<main>
  <section class="section">
    <div class="wrap">
      <p class="eyebrow" data-i18n="rewardsEyebrow"></p>
      <h2 data-i18n="rewardsTitle"></h2>
      <div class="facts">
        <div class="fact"><small data-i18n="fact1Label"></small><div class="v" data-i18n="fact1Val"></div></div>
        <div class="fact"><small data-i18n="fact2Label"></small><div class="v" data-i18n="fact2Val"></div></div>
        <div class="fact wide"><small data-i18n="fact3Label"></small><div class="v text" data-i18n="fact3Val"></div></div>
      </div>
      <div class="split" aria-hidden="true"><div class="you" data-i18n="splitYou"></div><div class="rest" data-i18n="splitRest"></div></div>
      <p class="split-cap" data-i18n="splitCap"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <p class="eyebrow" data-i18n="stepsEyebrow"></p>
      <h2 data-i18n="stepsTitle"></h2>
      <ol class="steps">

    var el = $("#followers-status");
    el.className = "status" + (statusKey === "okFollowers" ? " ok" : statusKey === "lowFollowers" ? " low" : "");
    el.textContent = statusKey ? T[lang][statusKey] : "";
  }
  function total() {
    var t = 0;
    PLATS.forEach(function (p) { var s = digits(plat[p[0]].fol.value); if (s) t += parseInt(s, 10); });
    return t;
  }
  function updateTotal() {
    var t = total();
    $("#total-val").textContent = fmt(t);
    statusKey = t ? (t >= MIN_FOLLOWERS ? "okFollowers" : "lowFollowers") : "";
    renderStatus();
  }
  PLATS.forEach(function (p) {
    var f = plat[p[0]].fol;
    f.addEventListener("input", updateTotal);
    f.addEventListener("blur", function () {
      var s = digits(f.value);
      if (s) f.value = fmt(parseInt(s, 10));
      updateTotal();
    });
  });

  function renderErrors() {
    $("#w-other-text").setAttribute("aria-invalid", errors.ways === "errWayOther" ? "true" : "false");
    ["name", "email", "plats", "ways", "start"].forEach(function (k) {
      var p = $("#err-" + k), key = errors[k];
      p.textContent = key ? T[lang][key] : "";
      p.hidden = !key;
      if (fields[k]) fields[k].setAttribute("aria-invalid", key ? "true" : "false");
    });
    PLATS.forEach(function (p) {
      ["id", "fol"].forEach(function (t) {
        plat[p[0]][t].setAttribute("aria-invalid", badInputs[p[0] + t] ? "true" : "false");
      });
    });
  }

  function validate() {
    errors = {}; badInputs = {}; focusEl = null;
    if (!fields.name.value.trim()) { errors.name = "errRequired"; focusEl = focusEl || fields.name; }
    var em = fields.email.value.trim();
    if (!em) { errors.email = "errRequired"; focusEl = focusEl || fields.email; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { errors.email = "errEmail"; focusEl = focusEl || fields.email; }
    var filled = 0, partial = false;
    PLATS.forEach(function (p) {
      var k = p[0], idv = plat[k].id.value.trim(), fol = digits(plat[k].fol.value);
      if (!idv && !fol) return;
      if (idv && fol) { filled++; return; }
      partial = true;
      var miss = idv ? "fol" : "id";
      badInputs[k + miss] = true;
      focusEl = focusEl || plat[k][miss];
    });
    if (partial) errors.plats = "errPlatPartial";
    else if (!filled) { errors.plats = "errPlatNone"; focusEl = focusEl || plat.youtube.id; }
    else if (total() < MIN_FOLLOWERS) {
      errors.plats = "errFollowers";
      var f1 = PLATS.filter(function (p) { return digits(plat[p[0]].fol.value); })[0];
      focusEl = focusEl || plat[f1[0]].fol;
    }
    var anyWay = $("#w-stream").checked || $("#w-post").checked || $("#w-other").checked;
    if (!anyWay) { errors.ways = "errWays"; focusEl = focusEl || $("#w-stream"); }
    else if ($("#w-other").checked && !$("#w-other-text").value.trim()) { errors.ways = "errWayOther"; focusEl = focusEl || $("#w-other-text"); }
    var sd = $("#f-start").value;
    if (!sd) { errors.start = "errStart"; focusEl = focusEl || $("#f-start"); }
    else if (sd < todayStr()) { errors.start = "errStartPast"; focusEl = focusEl || $("#f-start"); }
    return Object.keys(errors).length === 0;
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  $("#f-start").min = todayStr();
  $("#f-start").addEventListener("input", function () { if (errors.start) { delete errors.start; renderErrors(); } });

  function buildSummary() {
    var ways = [];
    if ($("#w-stream").checked) ways.push(WAY_EN.stream);
    if ($("#w-post").checked) ways.push(WAY_EN.post);
    if ($("#w-other").checked) ways.push("Other: " + $("#w-other-text").value.trim());
    var out = [
      "[Isle Raider KOL Application]",
      "Name: " + fields.name.value.trim(),
      "Email: " + fields.email.value.trim(),
      "Participation: " + ways.join(", "),
      "Planned start date: " + $("#f-start").value,
      "Total followers: " + fmt(total()),
      "Page language: " + lang,
      "Accounts:"
    ];
    PLATS.forEach(function (p) {
      var idv = plat[p[0]].id.value.trim(), fol = digits(plat[p[0]].fol.value);
      if (idv && fol) out.push("- " + p[1] + ": " + idv + " (" + fmt(parseInt(fol, 10)) + ")");
    });
    return out.join("\n");
  }

  // Earnings simulator: paying players x ARPPU of this language's market x revenue share
  var ARPPU = { "zh-TW": 12, ko: 13, ja: 15, en: 7 };  // USD per paying player, first 30 days
  var SHARE = 0.5;
  var SIM_MAX = 1000;
  function usd(n) { return "$" + fmt(n); }
  function renderSim() {
    var slider = $("#sim-payers");
    var n = parseInt(slider.value, 10) || 0;
    var a = ARPPU[lang];
    var total = n * a;
    var earn = Math.round(total * SHARE);
    var label = fmt(n) + " " + T[lang].simUnit;
    $("#sim-payers-out").textContent = label;
    slider.setAttribute("aria-valuetext", label);
    $("#sim-earn").textContent = usd(earn);
    $("#sim-total").textContent = usd(total);
    $("#sim-share").textContent = usd(earn);
    document.querySelectorAll(".bar").forEach(function (b) {
      var lv = parseInt(b.getAttribute("data-n"), 10);
      var v = Math.round(lv * a * SHARE);
      b.querySelector(".bar-name").textContent = fmt(lv) + " " + T[lang].simUnit;
      b.querySelector(".bar-fill").style.width = Math.max(3, v / (SIM_MAX * a * SHARE) * 100) + "%";
      b.querySelector(".bar-val").textContent = usd(v);
      b.classList.toggle("on", lv === n);
    });
  }
  $("#sim-payers").addEventListener("input", renderSim);
  document.querySelectorAll(".bar").forEach(function (b) {
    b.addEventListener("click", function () { $("#sim-payers").value = b.getAttribute("data-n"); renderSim(); });
  });

  $("#w-other").addEventListener("change", function () {
    $("#way-other-wrap").hidden = !this.checked;
    if (this.checked) $("#w-other-text").focus();
  });

  ["#w-stream", "#w-post", "#w-other", "#w-other-text"].forEach(function (sel) {
    $(sel).addEventListener(sel === "#w-other-text" ? "input" : "change", function () {
      if (errors.ways) { delete errors.ways; renderErrors(); }
    });
  });

  $("#apply-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var ok = validate();
    renderErrors();
    if (!ok) {
      if (focusEl) focusEl.focus();
      return;
    }
    if ($("#f-hp").value) return;
    var summaryText = buildSummary();
    if (SUBMIT_URL) { send(summaryText); return; }
    showManual(summaryText, false);
  });

  function showManual(summaryText, failed) {
    $("#summary").textContent = summaryText;
    $("#send-err").hidden = !failed;
    $("#res-sent").hidden = true;
    if (CONTACT_EMAIL) { $("#res-contact-val").textContent = CONTACT_EMAIL; $("#res-contact").hidden = false; }
    if (EXTERNAL_FORM_URL) { $("#res-form").setAttribute("href", EXTERNAL_FORM_URL); $("#res-form").hidden = false; }
    copyKey = ""; $("#copy-status").textContent = "";
    $("#apply-form").hidden = true;
    $("#result").hidden = false;
    $("#result").scrollIntoView({ block: "nearest" });
  }

  var sending = false;
  function send(summaryText) {
    if (sending) return;
    sending = true;
    var btn = $("#submit-btn");
    btn.disabled = true; btn.textContent = T[lang].sending;
    function done(okSent) {
      sending = false; btn.disabled = false; btn.textContent = T[lang].fSubmit;
      if (okSent) {
        $("#apply-form").hidden = true; $("#result").hidden = true; $("#res-sent").hidden = false;
        $("#res-sent").scrollIntoView({ block: "nearest" });
      } else { showManual(summaryText, true); }
    }
    var body = new URLSearchParams();
    body.set("name", fields.name.value.trim());
    body.set("email", fields.email.value.trim());
    body.set("start", $("#f-start").value);
    body.set("total", String(total()));
    body.set("lang", lang);
    body.set("summary", summaryText);
    body.set("hp", $("#f-hp").value);
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    fetch(SUBMIT_URL, { method: "POST", mode: "no-cors", body: body, signal: ctl ? ctl.signal : undefined })
      .then(function () { clearTimeout(timer); done(true); },
            function () { clearTimeout(timer); done(false); });
  }

  $("#edit-btn").addEventListener("click", function () {
    $("#result").hidden = true;
    $("#apply-form").hidden = false;
    fields.name.focus();
  });

  $("#copy-btn").addEventListener("click", function () {
    var text = $("#summary").textContent;
    function manual() {
      var r = document.createRange(); r.selectNodeContents($("#summary"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      copyKey = "copyFail"; $("#copy-status").textContent = T[lang].copyFail;
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        copyKey = "copied"; $("#copy-status").textContent = T[lang].copied;
      }, manual);
    } catch (e) { manual(); }
  });

  apply();
})();
</script>
